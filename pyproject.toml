[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espress-view"
version = "0.4.0"
description = "Desktop utility for discovering ESP serial devices and programming firmware"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/espress-view/assets/icons" = ["assets/icons/*.ico", "assets/icons/*.png"]
